version: '3.8'

services:
  # 后端开发服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: emby-client-go-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - DATABASE_TYPE=sqlite
      - DATABASE_DATABASE=./data/emby_manager.db
      - JWT_SECRET=dev-secret-key
      - LOG_LEVEL=debug
    networks:
      - emby-client-go-dev-network

  # 前端开发服务
  frontend:
    image: node:20-alpine
    container_name: emby-client-go-frontend-dev
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    networks:
      - emby-client-go-dev-network

networks:
  emby-client-go-dev-network:
    driver: bridge
